<main class="card-shell">
  <div class="prompt russian-prompt">{{Russian}}</div>
  <section aria-labelledby="writing-label">
    <h2 id="writing-label">Напишите иероглифы</h2>
    <div id="writers" class="writers"></div>
    <div id="writing-status" class="status" aria-live="polite"></div>
    <button id="retry-writing" class="secondary tappable" type="button" hidden>Написать ещё раз</button>
  </section>
  <div class="form-row">
    <label for="pinyin-input">Pinyin</label>
    <input id="pinyin-input" class="tappable" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
  </div>
  <div id="pinyin-status" class="status" aria-live="polite"></div>
  <div class="actions">
    <button id="check-answer" class="tappable" type="button">Проверить</button>
  </div>
</main>
<div class="secret-fields" aria-hidden="true">
  <span id="field-uid">{{UID}}</span><span id="field-hanzi">{{Hanzi}}</span><span id="field-pinyin">{{Pinyin}}</span>
</div>
<script src="_hanzi-data.js"></script>
<script src="_hanzi-writer.min.js"></script>
<script src="_card.js"></script>
<script>ChineseCards.initRuToZh();</script>
