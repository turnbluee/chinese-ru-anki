<main class="card-shell">
  <div class="prompt hanzi-prompt">{{Hanzi}}</div>
  <div class="form-row">
    <label for="russian-input">Перевод</label>
    <input id="russian-input" class="tappable" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
  </div>
  <div id="russian-status" class="status" aria-live="polite"></div>
  <div class="form-row">
    <label for="pinyin-input">Pinyin</label>
    <input id="pinyin-input" class="tappable" type="password" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
  </div>
  <div id="pinyin-status" class="status" aria-live="polite"></div>
  <div class="actions">
    <button id="check-answer" class="tappable" type="button">Проверить</button>
  </div>
</main>
<div class="secret-fields" aria-hidden="true">
  <span id="field-uid">{{UID}}</span><span id="field-pinyin">{{Pinyin}}</span><span id="field-russian-accepted">{{RussianAccepted}}</span>
</div>
<script src="_card.js"></script>
<script>ChineseCards.initZhToRu();</script>
